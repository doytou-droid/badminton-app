function shrink(file,max=1280,q=.72){return new Promise((res,rej)=>{
 const r=new FileReader();r.onerror=()=>rej(new Error("อ่านไฟล์ไม่ได้"));
 r.onload=e=>{const im=new Image();
  im.onerror=()=>rej(new Error("เปิดไฟล์ภาพนี้ไม่ได้"));
  im.onload=()=>{let w=im.width,h=im.height;
   if(w>max||h>max){const s=Math.min(max/w,max/h);w=Math.round(w*s);h=Math.round(h*s);}
   const c=document.createElement("canvas");c.width=w;c.height=h;
   c.getContext("2d").drawImage(im,0,0,w,h);res(c.toDataURL("image/jpeg",q));};
  im.src=e.target.result;};
 r.readAsDataURL(file);});}
function readAs(file){return new Promise((res,rej)=>{const r=new FileReader();
 r.onerror=()=>rej(new Error("อ่านไฟล์ไม่ได้"));r.onload=e=>res(e.target.result);r.readAsDataURL(file);});}
function loadPdfJs(){return new Promise((res,rej)=>{
 if(window.pdfjsLib)return res(window.pdfjsLib);
 const s=document.createElement("script");
 s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
 s.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc=
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";res(window.pdfjsLib);};
 s.onerror=()=>rej(new Error("โหลดตัวอ่าน PDF ไม่ได้"));document.head.appendChild(s);});}
async function pdfToImg(file,max){
 const lib=await loadPdfJs();
 const pdf=await lib.getDocument({data:await file.arrayBuffer()}).promise;
 const pg=await pdf.getPage(1);let vp=pg.getViewport({scale:1});
 vp=pg.getViewport({scale:Math.min(max/vp.width,max/vp.height,3)});
 const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;
 await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
 return c.toDataURL("image/jpeg",.8);}

  document.body.appendChild(t);}

 clearTimeout(window._tt);window._tt=setTimeout(()=>t.style.display="none",2600);}

async function loadAllOnce(){
 const [mg,bld,flr,rm,dp,ct,as,us] = await Promise.all([
  dbf.collection("managements").get(),dbf.collection("buildings").get(),dbf.collection("floors").get(),dbf.collection("rooms").get(),
  dbf.collection("depts").get(),dbf.collection("cats").get(),dbf.collection("assets").get(),dbf.collection("users").get()]);
 DB.managements=mg.docs.map(d=>({id:d.id,...d.data()}));
 DB.buildings=bld.docs.map(d=>({id:d.id,...d.data()}));
 DB.floors=flr.docs.map(d=>({id:d.id,...d.data()}));
 DB.rooms=rm.docs.map(d=>({id:d.id,...d.data()}));
 DB.depts=dp.docs.map(d=>({id:d.id,...d.data()}));
 DB.cats=ct.docs.map(d=>({id:d.id,code:d.id,...d.data()}));
 DB.assets=as.docs.map(d=>({id:d.id,...d.data()}));
 DB.users=us.docs.map(d=>({id:d.id,...d.data()}));
 const pm=await dbf.collection("perms").get();
 DB.perms={};pm.docs.forEach(d=>DB.perms[d.id]=d.data());
 Object.keys(DEFAULT_PERMS).forEach(r=>{if(!DB.perms[r])DB.perms[r]=DEFAULT_PERMS[r];});
 const lg=await dbf.collection("logs").orderBy("t","desc").limit(500).get();
 DB.logs=lg.docs.map(d=>({id:d.id,...d.data()}));}

function attachListeners(){
 const cols=[["managements","managements"],["buildings","buildings"],["floors","floors"],["rooms","rooms"],["depts","depts"],
  ["cats","cats"],["assets","assets"],["users","users"],["perms","perms"]];
 cols.forEach(([col,key])=>{
  const unsub=dbf.collection(col).onSnapshot(snap=>{
   if(key==="perms"){const obj={};snap.forEach(d=>obj[d.id]=d.data());
    Object.keys(DEFAULT_PERMS).forEach(r=>{if(!obj[r])obj[r]=DEFAULT_PERMS[r];});DB.perms=obj;}
   else if(key==="cats")DB.cats=snap.docs.map(d=>({id:d.id,code:d.id,...d.data()}));
   else DB[key]=snap.docs.map(d=>({id:d.id,...d.data()}));
   scheduleRerender();
  },err=>console.error(col,err));
  UNSUBS.push(unsub);});
 const unsubLog=dbf.collection("logs").orderBy("t","desc").limit(500).onSnapshot(snap=>{
  DB.logs=snap.docs.map(d=>({id:d.id,...d.data()}));scheduleRerender();});
 UNSUBS.push(unsubLog);}
function detachListeners(){UNSUBS.forEach(u=>u());UNSUBS=[];}
function scheduleRerender(){clearTimeout(rerenderTimer);rerenderTimer=setTimeout(()=>{if(ME)go(TAB);},200);}

/* ============================================================
   ส่วนที่ 5 : สิทธิ์การใช้งาน
   ============================================================ */
const RL=()=>ME.role;
const isSuper=()=>RL()==="superadmin";
function inB(bid){return isSuper()||!ME.scopeB||!ME.scopeB.length||ME.scopeB.includes(bid);}
function inF(fid){return isSuper()||!ME.scopeF||!ME.scopeF.length||ME.scopeF.includes(fid);}
function inC(c){return isSuper()||!ME.scopeC||!ME.scopeC.length||ME.scopeC.includes(c);}
function pv(res,act){const p=DB.perms[ME.role];return !!(p&&p[res]&&p[res][act]);}
function canBld(id,act){return pv("bld",act)&&inB(id);}
function canFlrP(f,act){return pv("flr",act)&&inB(f.bid);}
function canRoomP(r,act){return pv("room",act)&&inB(r.bid)&&inF(r.fid);}
function canAsset(room,cat,act){return (pv("room",act)&&inB(room.bid)&&inF(room.fid))||(pv("cat",act)&&inC(cat));}
function canAddAsset(r){return (pv("room","a")&&inB(r.bid)&&inF(r.fid))||pv("cat","a");}
function canPin(f){return pv("room","e")&&inB(r.bid)&&inF(f.id);}
function canDept(){return isSuper()||RL()==="bldadmin";}
function canAnyMaster(){return ["a","e","d"].some(x=>pv("bld",x)||pv("flr",x)||pv("room",x)||pv("cat",x))||canDept();}
function visRooms(){return DB.rooms.filter(r=>canRoomP(r,"v"));}
function visAssets(){return DB.assets.filter(a=>{const r=RM(a.room);return r.id&&canAsset(r,a.cat,"v");});}

async function doLogin(){
 let em=li_em.value.trim().toLowerCase(), pw=li_pw.value;
 if(!em||!pw){li_err.textContent="กรุณากรอกชื่อผู้ใช้และรหัสผ่าน";return;}
 if(em==="admin"){em="admin@msu.ac.th";}
 if(!em.includes("@"))em+=EMAIL_DOMAIN;
 li_err.textContent="";
 try{await auth.signInWithEmailAndPassword(em,pw);}
 catch(e){
  if(em==="admin@msu.ac.th" && (e.code==="auth/user-not-found"||e.code==="auth/invalid-credential")){
   try{
    const cred=await auth.createUserWithEmailAndPassword("admin@msu.ac.th","123456");
    await dbf.collection("users").doc(cred.user.uid).set({em:"admin@msu.ac.th",name:"ผู้ดูแลระบบหลัก",pos:"Admin",dept:DB.depts[0]?.id||"",tel:"-",role:"superadmin",scopeB:[],scopeF:[],scopeC:[],pending:false});
    await auth.signInWithEmailAndPassword("admin@msu.ac.th","123456");
    return;
   }catch(err){}
  }
  li_err.textContent=authErrorMsg(e);
 }}

async function submitReg(){
 const em=rg_em.value.trim().toLowerCase(),pw=rg_pw.value,pw2=rg_pw2.value;
 const nm=rg_nm.value.trim(),pos=rg_pos.value.trim(),dept=rg_dept.value;
 if(!emailValid(em))return alert("กรุณาใช้อีเมลที่ลงท้ายด้วย "+EMAIL_DOMAIN+" เท่านั้น");
 if(pw.length<6)return alert("รหัสผ่านต้องอย่างน้อย 6 ตัวอักษร");
 if(pw!==pw2)return alert("ยืนยันรหัสผ่านไม่ตรงกัน");
 if(!nm)return alert("กรอกชื่อ-สกุล");
 if(!dept)return alert("เลือกสังกัดหน่วยงาน");
 try{
  toast("กำลังสมัครสมาชิก...");
  const cred=await auth.createUserWithEmailAndPassword(em,pw);
  await dbf.collection("users").doc(cred.user.uid).set({em,name:nm,pos,dept,tel:"",
   role:"viewer",scopeB:[],scopeF:[],scopeC:[],pending:true});
 }catch(e){alert(authErrorMsg(e));}}

async function submitFg(){

auth.onAuthStateChanged(async user=>{
 detachListeners();
 if(!user){ME=null;document.getElementById("login").classList.remove("hidden");
  document.getElementById("app").classList.add("hidden");AUTHVIEW="login";renderAuth();return;}
 try{
  await seedIfEmpty();
  const adminChk=await dbf.collection("users").where("em","==","admin@msu.ac.th").limit(1).get();
  if(adminChk.empty){
   const aQuery=await auth.fetchSignInMethodsForEmail("admin@msu.ac.th").catch(()=>[]);
   if(!aQuery.length){
    try{const c=await secondaryAuth.createUserWithEmailAndPassword("admin@msu.ac.th","123456");
     await dbf.collection("users").doc(c.user.uid).set({em:"admin@msu.ac.th",name:"ผู้ดูแลระบบหลัก",pos:"Admin",dept:DB.depts[0]?.id||"",tel:"-",role:"superadmin",scopeB:[],scopeF:[],scopeC:[],pending:false});
     await secondaryAuth.signOut();}catch(ex){}
   }
  }

  let prof=null;
  for(let i=0;i<4;i++){
   const d=await dbf.collection("users").doc(user.uid).get();
   if(d.exists){prof=d.data();break;}
   await new Promise(r=>setTimeout(r,600));}
  if(!prof){
   prof={em:user.email,name:user.email,pos:"",dept:"",tel:"",role:user.email==="admin@msu.ac.th"?"superadmin":"viewer",scopeB:[],scopeF:[],scopeC:[],pending:user.email!=="admin@msu.ac.th"};
   await dbf.collection("users").doc(user.uid).set(prof);
  }
  await loadAllOnce();
  ME={id:user.uid,...prof};
  if(!ME.scopeB)ME.scopeB=[]; if(!ME.scopeF)ME.scopeF=[]; if(!ME.scopeC)ME.scopeC=[];
  attachListeners();
  start();
 }catch(e){alert("โหลดข้อมูลไม่สำเร็จ: "+e.message);}});

function start(){
 document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");
 let sc=[];
 if(ME.scopeB&&ME.scopeB.length)sc.push("อาคาร "+ME.scopeB.map(i=>B(i).code||"-").join(","));
 if(ME.scopeF&&ME.scopeF.length)sc.push("ชั้น "+ME.scopeF.map(i=>FL(i).no||"-").join(","));
 if(ME.scopeC&&ME.scopeC.length)sc.push("หมวด "+ME.scopeC.join(","));
 who.textContent=ME.name+" · "+ROLES[ME.role]+(DP(ME.dept).name?" · "+DP(ME.dept).name:"")+(sc.length?" · "+sc.join(" | "):" · ทุกขอบเขต");
 renderNav();go("dash");}
function renderNav(){
 nav.innerHTML=MENU.filter(m=>m[2]()).map(m=>`<button class="${TAB===m[0]?'on':''}" onclick="go('${m[0]}')">${m[1]}</button>`).join("");}
function go(t){
 if(typeof closeSidePanel==="function")closeSidePanel();

 if(!m||!m[2]())t="dash";
 TAB=t;renderNav();
 if(VIEWS[TAB])VIEWS[TAB]();else VIEWS.dash();}

function applyDF(){
 DF={m:df_m.value,b:df_b.value,f:df_f.value,d:df_d.value,c:df_c.value,s:df_s.value,q:df_q.value,d1:df_d1.value,d2:df_d2.value};
 if(DF.b&&B(DF.b).managementId!==DF.m&&DF.m)DF.m="";
 if(DF.f&&FL(DF.f).bid!==DF.b&&DF.b)DF.f="";go(TAB);}
function fRows(){
 let rows=visAssets().map(a=>({a,r:RM(a.room)}));rows=rows.filter(x=>x.r.id);

 if(DF.b)rows=rows.filter(x=>x.r.bid===DF.b);
 if(DF.f)rows=rows.filter(x=>x.r.fid===DF.f);
 if(DF.d)rows=rows.filter(x=>x.r.dept===DF.d||x.a.rdept===DF.d);
 if(DF.c)rows=rows.filter(x=>x.a.cat===DF.c);
 if(DF.s)rows=rows.filter(x=>x.a.status===DF.s);
 if(DF.d1)rows=rows.filter(x=>x.a.buy&&x.a.buy>=DF.d1);
 if(DF.d2)rows=rows.filter(x=>x.a.buy&&x.a.buy<=DF.d2);
 if(DF.q){const q=DF.q.toLowerCase();
  rows=rows.filter(x=>[x.a.name,x.a.no,x.a.sn,x.a.brand,x.a.model,DP(x.a.rdept).name,x.a.vendor,x.a.note].join(" ").toLowerCase().includes(q));}
 window._rows=rows;return rows;}

   <p style="color:#64748b;font-size:12px">ส่วนบริหาร: <b>${esc(MG(b.managementId).name)}</b> · ${esc(b.area)} · ${esc(b.beds)}</p>
   ${b.img?`<img src="${esc(b.img)}" style="max-width:100%;border-radius:8px;margin-top:8px">`:'<div class="hint" style="margin-top:8px">ยังไม่มีภาพรวมอาคาร</div>'}</div>

 <div class="card"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">

   ${PL.pin&&f.plan?`<select style="width:auto;min-width:230px" onchange="PL.room=this.value">
     <option value="">— เลือกห้องที่จะปักหมุด —</option>
     ${rms.map(r=>`<option value="${r.id}" ${r.id===PL.room?"selected":""}>${esc(r.code)} ${esc(r.name)}${r.x!=null?" ✓ปักแล้ว":""}</option>`).join("")}</select>`:""}

async function upBldImg(id,key){
 const file=await pickFile(true);if(!file)return;
 try{toast("กำลังประมวลผล...");
  const dataUrl=file.type==="application/pdf"?await pdfToImg(file,1800):await shrink(file,1800,.78);
  await dbf.collection("buildings").doc(id).set({[key]:dataUrl},{merge:true});toast("อัปโหลดสำเร็จ");}
 catch(e){alert("อัปโหลดไม่สำเร็จ: "+e.message);}}
async function upFloorImg(id,key){
 const file=await pickFile(true);if(!file)return;
 try{toast("กำลังประมวลผล...");
  const dataUrl=file.type==="application/pdf"?await pdfToImg(file,1800):await shrink(file,1800,.78);
  await dbf.collection("floors").doc(id).set({[key]:dataUrl},{merge:true});toast("อัปโหลดสำเร็จ");}
 catch(e){alert("อัปโหลดไม่สำเร็จ: "+e.message);}}
async function clickPlan(e){
 if(!PL.pin)return;
 if(!PL.room)return alert("กรุณาเลือกห้องที่จะปักหมุดจากช่องด้านบนก่อนครับ");
 const img=document.querySelector("#pw img");if(!img)return;
 const w=img.getBoundingClientRect();
 let x=((e.clientX-w.left)/w.width)*100,y=((e.clientY-w.top)/w.height)*100;
 x=Math.max(0,Math.min(100,x));y=Math.max(0,Math.min(100,y));
 const roomId=PL.room;
 try{await dbf.collection("rooms").doc(roomId).set({x:+x.toFixed(2),y:+y.toFixed(2)},{merge:true});
  const nx=DB.rooms.filter(z=>z.fid===PL.fid).find(z=>z.x==null);
  PL.room=nx?nx.id:"";vPlan();toast(nx?"บันทึกแล้ว":"ปักหมุดครบทุกห้องแล้ว");}
 catch(err){alert("บันทึกไม่สำเร็จ: "+err.message);}}
async function rmPin(id){
 try{await dbf.collection("rooms").doc(id).set({x:null,y:null},{merge:true});vPlan();toast("ลบหมุดแล้ว");}
 catch(e){alert("ลบไม่สำเร็จ");}}
function sidePeek(roomId){if(SIDE_PINNED)return;clearTimeout(SIDE_TIMER);renderSide(roomId);document.getElementById("sidePanel").classList.add("open");}
function sideLeaveMaybe(){if(SIDE_PINNED)return;SIDE_TIMER=setTimeout(()=>{document.getElementById("sidePanel").classList.remove("open");},300);}
function sidePin(roomId){SIDE_PINNED=true;renderSide(roomId);document.getElementById("sidePanel").classList.add("open");}
function toggleSidePanel(){const el=document.getElementById("sidePanel");if(el.classList.contains("open")){el.classList.remove("open");SIDE_PINNED=false;}else el.classList.add("open");}
function closeSidePanel(){const el=document.getElementById("sidePanel");if(el)el.classList.remove("open");SIDE_PINNED=false;}

    ${a.img?`<img src="${esc(a.img)}" style="width:32px;height:32px;object-fit:cover;border-radius:4px;flex-shrink:0">`:'<div style="width:32px;height:32px;background:#e2e8f0;border-radius:4px;flex-shrink:0"></div>'}

let openFl={}, openRoomAssets={};
function vFloor(){view.innerHTML=filterBar()+'<div id="fl"></div>';flList();}
function flList(){
 const rows=fRows();

 fl.innerHTML=bs.map(b=>{

   const rms=DB.rooms.filter(r=>r.fid===f.id&&(!DF.d||r.dept===DF.d)&&canRoomP(r,"v"));
   let cnt=0;
   const body=rms.map(r=>{

      <button class="btn-s btn-sm" onclick="openRoomAssets['${r.id}']=!${isAssetOpen};flList()">${isAssetOpen?"▼ ยุบครุภัณฑ์":"▲ ขยายครุภัณฑ์"} (${as.length})</button>

     ${isAssetOpen?(as.length?assetTable(as,r):'<div style="color:#94a3b8;font-size:12px;margin-top:6px">ยังไม่มีครุภัณฑ์ในห้องนี้</div>'):""}</div>`;

async function bulkDel(col){
 const ids=[...document.querySelectorAll(".chk-"+col+":checked")].map(c=>c.value);
 if(!ids.length)return alert("กรุณาเลือกรายการที่ต้องการลบ");

  for(const id of ids)await dbf.collection(col).doc(id).delete();
  toast("ลบสำเร็จ");vMaster();

  <div id="a4box"></div>`;}

function execExport(){
 EXPORT_COLS={
  no:c_no.checked, name:c_name.checked, spec:c_spec.checked, brand:c_brand.checked,
  qty:c_qty.checked, price:c_price.checked, total:c_total.checked, buy:c_buy.checked,
  vendor:c_vendor.checked, dept:c_dept.checked, status:c_status.checked,
  floor:c_floor.checked, room:c_room.checked};
 const rId=EX_R, fId=EX_F, bId=EX_B;
 if(!bId)return alert("กรุณาเลือกอาคาร");
 if(rId)printRoomA4(rId);
 else if(fId)printFloorA4(fId);
 else printBldA4(bId);}

function buildThHeaders(){
 let h=`<tr><th style="width:30px">ที่</th>`;
 if(EXPORT_COLS.no)h+=`<th>เลขครุภัณฑ์</th>`;
 if(EXPORT_COLS.name)h+=`<th>รายการ</th>`;
 if(EXPORT_COLS.spec)h+=`<th>คุณลักษณะ</th>`;
 if(EXPORT_COLS.brand)h+=`<th>ยี่ห้อ/รุ่น</th>`;
 if(EXPORT_COLS.qty)h+=`<th style="text-align:center">จน.</th>`;
 if(EXPORT_COLS.price)h+=`<th style="text-align:right">ราคา/หน่วย</th>`;
 if(EXPORT_COLS.total)h+=`<th style="text-align:right">รวม</th>`;
 if(EXPORT_COLS.buy)h+=`<th>วันที่ซื้อ</th>`;
 if(EXPORT_COLS.vendor)h+=`<th>ผู้ขาย</th>`;
 if(EXPORT_COLS.dept)h+=`<th>หน่วยงาน</th>`;
 if(EXPORT_COLS.status)h+=`<th>สถานะ</th>`;
 if(EXPORT_COLS.floor)h+=`<th>ชั้น</th>`;
 if(EXPORT_COLS.room)h+=`<th>ห้อง</th>`;
 return h+`</tr>`;}

function buildTrRows(list){
 return list.map((item,i)=>{
  const a=item.a||item, r=item.r||RM(a.room);
  let res=`<tr><td style="text-align:center">${i+1}</td>`;
  if(EXPORT_COLS.no)res+=`<td>${esc(a.no)}</td>`;
  if(EXPORT_COLS.name)res+=`<td><b>${esc(a.name)}</b></td>`;
  if(EXPORT_COLS.spec)res+=`<td>${esc(a.spec)}</td>`;
  if(EXPORT_COLS.brand)res+=`<td>${esc(a.brand)} ${esc(a.model)}</td>`;
  if(EXPORT_COLS.qty)res+=`<td style="text-align:center">${a.qty||1}</td>`;
  if(EXPORT_COLS.price)res+=`<td style="text-align:right">${money(a.price)}</td>`;
  if(EXPORT_COLS.total)res+=`<td style="text-align:right">${money((+a.price||0)*(+a.qty||1))}</td>`;
  if(EXPORT_COLS.buy)res+=`<td>${esc(a.buy)}</td>`;
  if(EXPORT_COLS.vendor)res+=`<td>${esc(a.vendor)}</td>`;
  if(EXPORT_COLS.dept)res+=`<td>${esc(DP(a.rdept).name)}</td>`;
  if(EXPORT_COLS.status)res+=`<td>${esc(a.status)}</td>`;
  if(EXPORT_COLS.floor)res+=`<td>${esc(FL(r.fid).no)}</td>`;
  if(EXPORT_COLS.room)res+=`<td>${esc(r.code)}</td>`;
  return res+`</tr>`;}).join("");}

function paperA4(contentHtml){

function printRoomA4(id){
 const r=RM(id),as=DB.assets.filter(a=>a.room===id);
 const tot=as.reduce((s,a)=>s+(+a.price||0)*(+a.qty||1),0);
 const head=`<div style="text-align:center;margin-bottom:10px"><h2>แบบสำรวจ/ทะเบียนครุภัณฑ์</h2>
  <h3>โรงพยาบาลสุทธาเวช คณะแพทยศาสตร์ มหาวิทยาลัยมหาสารคาม</h3></div>
  <table style="border:0;margin-bottom:10px"><tr>
  <td style="border:0"><b>อาคาร:</b> ${esc(B(r.bid).name)}</td><td style="border:0"><b>ชั้น:</b> ${esc(FL(r.fid).no)}</td>

 mo(`<h3>${u?"แก้ไขผู้ใช้":"เพิ่มผู้ใช้ใหม่"}</h3>

async function saveUser(id){
 const name=u_nm.value,pos=u_pos.value,dept=u_dept.value,tel=u_tel.value,role=u_rl.value;
 try{
  if(id){await dbf.collection("users").doc(id).set({name,pos,dept,tel,role},{merge:true});}
  else{const em=u_em.value.trim().toLowerCase(),pw=u_pw.value;
   if(!emailValid(em))return alert("อีเมลต้องลงท้ายด้วย "+EMAIL_DOMAIN);
   if(pw.length<6)return alert("รหัสผ่านอย่างน้อย 6 ตัว");
   toast("กำลังสร้างบัญชี...");
   const cred=await secondaryAuth.createUserWithEmailAndPassword(em,pw);
   await dbf.collection("users").doc(cred.user.uid).set({em,name,pos,dept,tel,role,scopeB:[],scopeF:[],scopeC:[],pending:false});
   await secondaryAuth.signOut();}
  mc();vUser();toast("บันทึกสำเร็จ");
 }catch(e){alert(authErrorMsg(e));}}
async function approveUser(id){await dbf.collection("users").doc(id).set({pending:false},{merge:true});mc();vUser();}
async function delUser(id){if(!confirm("ยืนยันลบผู้ใช้?"))return;await dbf.collection("users").doc(id).delete();vUser();}

function vData(){
 view.innerHTML=`<div class="card"><b>นำเข้าข้อมูลด่วนผ่านไฟล์ Excel (CSV) และสำรองข้อมูล</b>
  <p style="color:#64748b;font-size:12px;margin:8px 0">คุณสามารถดาวน์โหลดฟอร์ม CSV กรอกข้อมูลครุภัณฑ์ แล้วอัปโหลดเข้าสู่ระบบได้ทันที ระบบจะบันทึกลงคลาวด์และสามารถแก้ไขย้อนหลังได้</p>

   <button class="btn" onclick="dlCsvTemplate()">📥 ดาวน์โหลดไฟล์ฟอร์มนำเข้า (CSV)</button>

   <button class="btn-s" onclick="expJson()">สำรองข้อมูล (JSON)</button></div>
   <input type="file" id="impCsvInput" accept=".csv" class="hidden" onchange="processCsvUpload(this)"></div>`;}
function dlCsvTemplate(){
 const header="เลขครุภัณฑ์,ชื่อครุภัณฑ์,รหัสห้อง(เช่น OPD1-01),รหัสหมวด(เช่น 10),ยี่ห้อ,รุ่น,ราคา,จำนวน,บริษัทผู้ซื้อ,วันที่ซื้อ(YYYY-MM-DD),สถานะ";
 const sample="6515-001-0001/1-68,เตียงผู้ป่วยไฟฟ้า,OPD1-01,10,Hill-Rom,Advanta 2,75000,1,บริษัท เมดิคอล จำกัด,2024-01-15,ใช้งานปกติ";
 dl("template_import_assets.csv",header+"\n"+sample,"text/csv;charset=utf-8");}
async function processCsvUpload(el){
 const f=el.files[0];if(!f)return;
 const reader=new FileReader();
 reader.onload=async function(e){
  const lines=e.target.result.split("\n");let count=0;
  toast("กำลังนำเข้าข้อมูล...");
  for(let i=1;i<lines.length;i++){
   const line=lines[i].trim();if(!line)continue;
   const cols=line.split(",").map(c=>c.replace(/^"|"$/g,"").trim());
   if(cols.length>=2){
    const roomCode=cols[2];
    const room=DB.rooms.find(x=>x.code===roomCode)||DB.rooms[0];
    if(room){
     const o={no:cols[0],name:cols[1],room:room.id,cat:cols[3]||"10",brand:cols[4]||"",model:cols[5]||"",
      price:+cols[6]||0,qty:+cols[7]||1,vendor:cols[8]||"",buy:cols[9]||"",status:cols[10]||"ใช้งานปกติ",
      rdept:room.dept,spec:"",note:"นำเข้าผ่าน CSV",img:"",pdf:null,created:new Date().toISOString(),by:ME.em};
     await dbf.collection("assets").add(o);count++;
    }
   }
  }
  log("import","นำเข้าครุภัณฑ์ด่วนผ่าน CSV จำนวน "+count+" รายการ");
  alert("นำเข้าข้อมูลสำเร็จ "+count+" รายการ! คุณสามารถตรวจสอบและแก้ไขภายหลังได้ที่เมนูข้อมูล/รายละเอียด");
  go("dash");};
 reader.readAsText(f,"UTF-8");}
function dl(n,c,t){const b=new Blob(["\ufeff"+c],{type:t});const u=URL.createObjectURL(b);
 const a=document.createElement("a");a.href=u;a.download=n;a.click();URL.revokeObjectURL(u);}
function expJson(){
 const o={managements:DB.managements,buildings:DB.buildings,floors:DB.floors,rooms:DB.rooms,depts:DB.depts,cats:DB.cats,assets:DB.assets};
 dl("hosp_backup_"+new Date().toISOString().slice(0,10)+".json",JSON.stringify(o,null,2),"application/json");}
function expCsv(kind){
 const src=visAssets().map(a=>({a,r:RM(a.room)}));
 const rows=[["อาคาร","ชั้น","รหัสห้อง","ชื่อห้อง","เลขครุภัณฑ์","รายการ","หมวด","ยี่ห้อ","รุ่น","จำนวน","ราคา","สถานะ"],
  ...src.map(({a,r})=>[B(r.bid).name,FL(r.fid).no,r.code,r.name,a.no,a.name,a.cat,a.brand,a.model,a.qty,a.price,a.status])];
 dl("export_assets.csv",rows.map(r=>r.map(c=>`"${(c==null?"":String(c)).replace(/"/g,'""')}"`).join(",")).join("\n"),"text/csv;charset=utf-8");}

function mo(h){

 modal.querySelectorAll("input,select,textarea").forEach(el=>{

function mc(){
 if(DIRTY&&!confirm("มีข้อมูลที่ยังไม่ได้บันทึก ต้องการปิดหน้าต่างนี้หรือไม่?"))return;
 DIRTY=false;modal.innerHTML="";}
